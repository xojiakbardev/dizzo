[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dizzo-backend"
version = "1.0.0"
description = "Dizzo FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "PyJWT>=2.8,<3.0",
  # RS256/ES256/EdDSA JWT verification (Telegram's OIDC id_token, JWKS) —
  # PyJWT only pulls this in as an extra, and we need it unconditionally
  # now, not just when "PyJWT[crypto]" happens to be requested elsewhere.
  "cryptography>=42,<46",
  "bcrypt>=4.1,<5.0",
  "httpx>=0.27,<1.0",
  "email-validator>=2.2,<3.0",
  "boto3>=1.34,<2.0",
  # Checks and measures cart print files, renders white underbase masks.
  "pillow>=11,<13",
  "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
  "black>=24.0,<27.0",
  "mypy>=1.10,<2.0",
  "pre-commit>=3.7,<5.0",
]
bot = [
  "aiogram>=3.13,<4.0",
]

[tool.setuptools.packages.find]
include = ["app*", "bot*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:pytest_asyncio.plugin",
]

[tool.coverage.run]
source = ["app", "bot"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
