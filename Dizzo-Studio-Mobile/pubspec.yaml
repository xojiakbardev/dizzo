name: dizzo
description: "Dizzo: design and order custom prints (customer app)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.1.1
  flutter_svg: ^2.3.0
  flutter_widget_from_html_core: ^0.17.4
  gal: ^2.3.3
  geolocator: ^14.0.3
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: any
  latlong2: ^0.10.1
  package_info_plus: ^10.2.1
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# App icon: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher/icon.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/launcher/icon_foreground.png
  adaptive_icon_monochrome: assets/launcher/icon_monochrome.png
  min_sdk_android: 23

# Launch screen: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/launcher/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/launcher/splash_android12.png
  android: true
  ios: true
  web: false
